name: Build Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
          
      - name: Get dependencies
        run: flutter pub get

      - name: Flutter doctor
        run: flutter doctor -v || true

      - name: Build APK (debug, signed with debug key)
        run: |
          flutter build apk --debug --verbose

      - name: Determine version
        id: version
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            VERSION="${{ github.ref_name }}"
          else
            VERSION="dev-$(echo '${{ github.sha }}' | cut -c1-7)"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "APK version: $VERSION"

      - name: Prepare release APK
        run: |
          mkdir -p release
          APK_SRC="build/app/outputs/flutter-apk/app-debug.apk"
          APK_DST="release/ZTCD-${{ steps.version.outputs.version }}.apk"
          if [ -f "$APK_SRC" ]; then
            cp "$APK_SRC" "$APK_DST"
            echo "APK ready: $APK_DST"
            ls -lh release/
          else
            echo "ERROR: APK not found at $APK_SRC"
            ls -lh build/app/outputs/ || true
            exit 1
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZTCD-${{ steps.version.outputs.version }}-apk
          path: release/ZTCD-${{ steps.version.outputs.version }}.apk
          retention-days: 30

      - name: Create GitHub Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release/ZTCD-${{ steps.version.outputs.version }}.apk
          generate_release_notes: true
          body: |
            # Zero-Touch Car Diagnostics ${{ steps.version.outputs.version }}

            ## Features
            - OBD-II Telemetry (50+ PIDs via Bluetooth/USB/Simulation)
            - Phone Sensor Fusion (Accelerometer, Gyroscope, GPS)
            - Real-time Damage Scoring
            - Trip Logging with Route Analysis
            - AI-Powered Diagnostics (Google Gemini 2.5 Pro)
            - Google Maps integration

            ## Installation
            1. Download `ZTCD-${{ steps.version.outputs.version }}.apk`
            2. Enable "Install from unknown sources" in Android settings
            3. Install the APK
            4. (Optional) Configure your Gemini API key in Settings

            > **Note:** This is a debug-signed APK. See [RELEASE.md](RELEASE.md) for release-signing instructions.

            **Commit**: ${{ github.sha }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

