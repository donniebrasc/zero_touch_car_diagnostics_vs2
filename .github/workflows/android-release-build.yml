name: Android Release Build

on:
  push:
    branches:
      - release/v1.32.12-beta
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Setup Flutter and Android SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '2.10.0'

      - name: Decode KEYSTORE_BASE64
        if: secrets.KEYSTORE_BASE64 != ''
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/release.keystore

      - name: Set up environment variables
        run: |
          echo "KEYSTORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}" >> $GITHUB_ENV
          echo "KEY_ALIAS=${{ secrets.KEY_ALIAS }}" >> $GITHUB_ENV
          echo "KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> $GITHUB_ENV

      - name: Build APK
        run: |
          cd android && ./gradlew clean renameReleaseApk

      - name: Upload APK
        uses: actions/upload-artifact@v2
        with:
          name: ZTCDv1.32.12BETA
          path: android/app/build/outputs/apk/release/ZTCDv1.32.12BETA.apk
